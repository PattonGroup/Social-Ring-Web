name: Trigger Home Lab Deployment

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Start private deployment workflow
        env:
          DEPLOY_TOKEN: ${{ secrets.HOMELAB_DEPLOY_TOKEN }}
          DEPLOY_BRANCH: main
        run: |
          set -euo pipefail

          test -n "$DEPLOY_TOKEN"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DEPLOY_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/PattonGroup/homelab-deploy/actions/workflows/deploy-social-ring.yml/dispatches \
            --data "{\"ref\":\"$DEPLOY_BRANCH\"}"

          echo "Home lab deployment requested."
